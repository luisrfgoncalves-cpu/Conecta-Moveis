<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ledStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0" />
    </linearGradient>
    <filter id="kitchenGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#kitGrad)" />
  
  <!-- Armários Superiores em MDF Carvalho e Grafite -->
  <rect x="40" y="40" width="160" height="130" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <rect x="210" y="40" width="180" height="130" rx="4" fill="#451a03" stroke="#78350f" stroke-width="1.5" opacity="0.9" />
  <rect x="400" y="40" width="160" height="130" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />

  <!-- Fita de LED Embutida com Glow -->
  <line x1="40" y1="172" x2="560" y2="172" stroke="url(#ledStrip)" stroke-width="4" filter="url(#kitchenGlow)" />

  <!-- Bancada em Granito Escuro e Nicho -->
  <rect x="30" y="240" width="540" height="20" rx="2" fill="#0f172a" stroke="#334155" />
  <!-- Armários Inferiores com Puxador Cava -->
  <rect x="40" y="262" width="165" height="110" rx="4" fill="#1e293b" />
  <line x1="40" y1="272" x2="205" y2="272" stroke="#ea580c" stroke-width="1.5" opacity="0.6" />
  <rect x="215" y="262" width="170" height="110" rx="4" fill="#1e293b" />
  <line x1="215" y1="272" x2="385" y2="272" stroke="#ea580c" stroke-width="1.5" opacity="0.6" />
  <rect x="395" y="262" width="165" height="110" rx="4" fill="#1e293b" />
  <line x1="395" y1="272" x2="560" y2="272" stroke="#ea580c" stroke-width="1.5" opacity="0.6" />

  <!-- Tag Ilustrativa Tecnológica -->
  <rect x="40" y="330" width="130" height="24" rx="6" fill="#030712" fill-opacity="0.8" stroke="#f97316" stroke-width="1" />
  <text x="105" y="346" font-family="sans-serif" font-size="10" font-weight="700" fill="#fed7aa" text-anchor="middle">COZINHA PLANEJADA</text>
</svg>

