<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="painelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="warmLed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="1" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#painelGrad)" />

  <!-- Grande Painel TV com Marmorato e LED Traseiro -->
  <rect x="50" y="40" width="500" height="260" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5" />
  
  <!-- Linha LED Superior e Inferior Flutuante -->
  <line x1="50" y1="38" x2="550" y2="38" stroke="url(#warmLed)" stroke-width="3.5" />
  <line x1="50" y1="302" x2="550" y2="302" stroke="url(#warmLed)" stroke-width="3.5" />

  <!-- Rack Suspenso com Portas Basculantes -->
  <rect x="70" y="270" width="460" height="70" rx="4" fill="#09090b" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="220" y1="270" x2="220" y2="340" stroke="#27272a" stroke-width="1.5" />
  <line x1="380" y1="270" x2="380" y2="340" stroke="#27272a" stroke-width="1.5" />

  <!-- Tag Ilustrativa -->
  <rect x="70" y="350" width="160" height="24" rx="6" fill="#030712" fill-opacity="0.85" stroke="#f97316" stroke-width="1" />
  <text x="150" y="366" font-family="sans-serif" font-size="10" font-weight="700" fill="#fed7aa" text-anchor="middle">PAINÉIS DE ALTO PADRÃO</text>
</svg>

