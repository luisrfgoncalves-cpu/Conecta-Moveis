<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="furniturePattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="100" height="60" rx="4" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.25"/>
      <line x1="10" y1="40" x2="110" y2="40" stroke="#ea580c" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="60" cy="55" r="2" fill="#ea580c" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#woodGradient)" />
  <rect width="100%" height="100%" fill="url(#furniturePattern)" />
</svg>

