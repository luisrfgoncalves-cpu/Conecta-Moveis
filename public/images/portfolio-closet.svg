<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="panelLed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#wardGrad)" />

  <!-- Painel Ripado de Marcenaria com Iluminação de Contorno -->
  <g opacity="0.85">
    <rect x="50" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="68" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="86" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="104" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="122" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="140" y="30" width="8" height="340" fill="#78350f" rx="2" />
    <rect x="158" y="30" width="8" height="340" fill="#78350f" rx="2" />
  </g>

  <!-- Guarda-roupa Embutido com Portas de Vidro Reflecta -->
  <rect x="180" y="30" width="180" height="340" rx="4" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="370" y="30" width="180" height="340" rx="4" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cabideiro Iluminado Interno -->
  <line x1="190" y1="120" x2="350" y2="120" stroke="url(#panelLed)" stroke-width="3" />
  <line x1="380" y1="120" x2="540" y2="120" stroke="url(#panelLed)" stroke-width="3" />

  <!-- Tag Ilustrativa -->
  <rect x="390" y="330" width="140" height="24" rx="6" fill="#030712" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
  <text x="460" y="346" font-family="sans-serif" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle">CLOSETS E PLANEJADOS</text>
</svg>

