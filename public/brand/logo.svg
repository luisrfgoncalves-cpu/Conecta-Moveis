<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <!-- Gradiente do Símbolo / Âmbar Incandescente -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base do Ícone com Borda Glow e Vidro Fumê -->
  <rect x="6" y="8" width="54" height="54" rx="14" fill="#0B0F17" stroke="url(#neonGlow)" stroke-width="1.5" />
  
  <!-- Símbolo Moderno Isométrico Moveleiro com Glow -->
  <g filter="url(#glowFilter)">
    <!-- Bloco Principal com Chanfro -->
    <path d="M18 20C18 17.79 19.79 16 22 16H36V28H24C20.69 28 18 25.31 18 22V20Z" fill="url(#brandGrad)" />
    <!-- Bloco de Conexão Inferior -->
    <path d="M30 28H44C46.21 28 48 29.79 48 32V44C48 46.21 46.21 48 44 48H32C29.79 48 28 46.21 28 44V34C28 30.69 30.69 28 34 28H30Z" fill="#F8FAFC" fill-opacity="0.95" />
    <!-- Ponto de Fixação Precisa (LED Accent) -->
    <circle cx="37" cy="38" r="3" fill="#FF8A00" />
  </g>

  <!-- Tipografia Premium -->
  <text x="74" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="25" fill="#F8FAFC" letter-spacing="-0.5">CONECTA</text>
  <text x="204" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="25" fill="url(#brandGrad)" letter-spacing="-0.5">MÓVEIS</text>
  
  <!-- Tagline Tecnológica -->
  <rect x="74" y="47" width="138" height="13" rx="3" fill="#1E293B" fill-opacity="0.7" />
  <text x="80" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="8" fill="#FF8A00" letter-spacing="1.8">PLATAFORMA MOVELEIRA</text>
</svg>
